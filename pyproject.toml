[project]
name = "volforecast"
version = "0.1.0"
description = "Forecasting next-week realized volatility of S&P 500 stocks (CS1090A/AC209A project 12)"
readme = "README.md"
requires-python = ">=3.12,<3.14"  # matches the AC-209A course environment
dependencies = [
    "numpy>=2.3,<3",
    "pandas>=3,<4",  # the course moved to pandas 3 in section 02
    "pyarrow>=21",  # parquet caches under data/
    "requests",  # SEC EDGAR, FRED and Ken French downloads
    "yfinance",
    "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "jupyter", "nbconvert", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volforecast"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "RUF", "SIM", "C4", "NPY", "PTH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]
"notebooks/*.ipynb" = ["D", "E501", "E702", "E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
