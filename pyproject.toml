[project]
name = "volforecast"
version = "0.1.0"
description = "Forecasting next-week realized volatility of S&P 500 stocks (CS1090A/AC209A project 12)"
readme = "README.md"
authors = [
    {name = "Ashley Lee"}, {name = "Juntang Wang"}, {name = "Shuo Yang"},
    {name = "Simon Manivong"}, {name = "Terry Su"},
]
keywords = ["realized volatility", "HAR", "S&P 500", "forecasting", "gradient boosting"]
requires-python = ">=3.12,<3.14"  # matches the AC-209A course environment
dependencies = [
    # Floors stay low so Colab's preinstalled stack satisfies them without a restart.
    "matplotlib>=3.8",
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=15",  # parquet engine for the caches under data/
    "python-dotenv>=1",  # reads SEC_USER_AGENT and API keys from .env
    "requests>=2.31",  # SEC EDGAR
    "yfinance>=1",
]

[project.urls]
Repository = "https://github.com/qqgjyx/AC-209A_VolForecast"

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel", "nbconvert"]  # for pip users; uv sync installs them via dev
crsp = ["sqlalchemy>=2", "psycopg[binary]>=3"]  # CRSP via WRDS; per-user licence

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "jupyter", "nbconvert", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volforecast"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "RUF", "SIM", "C4", "NPY", "PTH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]
"*.ipynb" = ["D", "E501", "E702", "E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
